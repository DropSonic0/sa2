STATIC = 1

include $(PSL1GHT)/ppu_rules
export PATH := $(PATH):$(PS3DEV)/bin

CFLAGS += -mcpu=cell -g3
CXXFLAGS := $(CFLAGS)
CPPFLAGS += -D__PS3__

PS3_LIBS := -lnet -lsysutil -lsysmodule -lGL -lEGL -lrsx -lgcm_sys -lio -lrt -llv2 -lz -lcurl -lpolarssl

LIBS += $(PS3_LIBS)

LIBPATHS += -L$(PS3DEV)/ppu/lib
INCLUDES += -I$(PS3DEV)/ppu/include

SUFFIX = .elf
PKGSUFFIX = .self
